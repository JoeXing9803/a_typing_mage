<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type Spell</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="score">Score 0</div>
    <div id="wave">Wave 1</div>
    <button id="gear" title="Settings (Esc)" aria-label="Settings">&#9881;</button>
  </header>

  <!-- panel 2: the battlefield -->
  <section id="panel2">
    <div id="field">
      <canvas id="art"></canvas>
      <canvas id="fx"></canvas>
      <div id="combo"></div>
      <div id="banner"></div>
    </div>
    <div id="focusbar"><div id="focusfill"></div><span id="focuslabel"></span></div>
  </section>

  <!-- panel 1: health and the words panel -->
  <section id="panel1">
    <div id="statusrow">
      <div id="wpm">0 wpm</div>
      <div id="health"><div id="hpfill"></div><span id="hptext"></span></div>
      <div id="guards"></div>
    </div>
    <div id="words" class="box"></div>
  </section>

  <!-- settings: grows out of the words panel into the middle of the screen -->
  <div id="dim" class="hidden"></div>
  <div id="settings" class="box hidden">
    <h2 class="set-title">Paused</h2>
    <div class="set-body">
      <div class="set-left">
        <button id="optMusic"></button>
        <button id="optSfx"></button>
        <button id="optCountdown"></button>
        <button id="optTheme"></button>
        <button id="optMenu">Main menu</button>
        <button id="optBack">Back to game</button>
      </div>
      <div class="set-right">
        <h3>Your wizard</h3>
        <div id="abilityList"></div>
        <h3>Your powers</h3>
        <div id="powerList"></div>
      </div>
    </div>
  </div>

  <div id="overlay" class="hidden"></div>

  <div id="themeModal" class="hidden">
    <div class="modal-box">
      <button id="themeClose" class="x" aria-label="Close">&times;</button>
      <input id="themeSearch" type="text" placeholder="Search theme..." autocomplete="off">
      <div id="themeList"></div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/words.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/powers.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
