<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spellfire: a typing mage</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="top"><span id="hp"></span><span id="wave"></span><span id="score"></span></div>
  <div id="field"><canvas id="cv"></canvas><div id="combo"></div><div id="buffs"></div></div>
  <div class="tl"><i id="bar"></i></div>
  <div id="panel"><div id="tag"></div><div id="word"></div><div id="desc"></div></div>
</div>
<div id="overlay"></div>
<input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type here">
<script src="script.js"></script>
</body>
</html>
